<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap">
<style>
  :root {
    --bg:      #0a0f1e;
    --surface: #0f1729;
    --border:  #1e2d4a;
    --accent:  #3b82f6;
    --accent2: #06b6d4;
    --danger:  #ef4444;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --glow:    rgba(59,130,246,.15);
    --glow2:   rgba(6,182,212,.1);
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;overflow:hidden}

  .app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto;padding:env(safe-area-inset-top,16px) 0 env(safe-area-inset-bottom,0px)}

  /* Header */
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
  .logo{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:400;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
  .status-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .4s,box-shadow .4s}
  .dot.online{background:#22c55e;box-shadow:0 0 8px #22c55e88}
  .dot.error{background:var(--danger)}
  .dot.loading{background:var(--accent);animation:pdot 1s infinite}
  @keyframes pdot{0%,100%{opacity:1}50%{opacity:.3}}

  /* Orb */
  .orb-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative}
  .orb-wrap{position:relative;width:160px;height:160px}
  .ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--border);opacity:0;transition:opacity .5s}
  .ring.r2{inset:-14px;animation-direction:reverse;animation-duration:18s}
  .ring.r3{inset:-28px;animation-duration:25s}
  .ring.on{opacity:1;animation:spin 12s linear infinite}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 36%,#1e3a5f 0%,#0d1f3c 55%,var(--bg) 100%);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .orb::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 36%,rgba(59,130,246,.25) 0%,transparent 60%);opacity:0;transition:opacity .4s}
  .orb.listening::before{opacity:1}
  .orb.speaking::before{background:radial-gradient(circle at 38% 36%,rgba(6,182,212,.3) 0%,transparent 60%);opacity:1}
  .pulse{width:32px;height:32px;border-radius:50%;background:var(--accent);opacity:.15;transition:transform .15s,opacity .15s}
  .orb.listening .pulse{opacity:.5;animation:breathe .8s ease-in-out infinite}
  .orb.speaking  .pulse{background:var(--accent2);opacity:.6;animation:breathe .4s ease-in-out infinite}
  .orb.processing .pulse{opacity:.3;animation:breathe 1.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}
  .state-lbl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;min-height:16px;transition:color .3s}
  .state-lbl.listening{color:var(--accent)}
  .state-lbl.speaking{color:var(--accent2)}

  /* Chat */
  .chat{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;animation:fin .2s ease}
  @keyframes fin{from{opacity:0;transform:translateY(4px)}}
  .msg.user{align-self:flex-end;background:var(--surface);border:1px solid var(--border)}
  .msg.jarvis{align-self:flex-start;background:linear-gradient(135deg,#0f1f3d,#0d1a30);border:1px solid rgba(59,130,246,.2)}
  .msg.iniciativa{border-color:rgba(6,182,212,.2);background:linear-gradient(135deg,#0a1f28,#0d1a22)}
  .msg-meta{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:4px}

  /* Bottom bar */
  .bottom-bar{padding:12px 20px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:10px;align-items:center}
  .txt-in{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:10px 16px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
  .txt-in:focus{border-color:var(--accent)}
  .txt-in::placeholder{color:var(--muted)}
  .mic-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s;flex-shrink:0}
  .mic-btn:active{transform:scale(.93)}
  .mic-btn.rec{background:var(--danger);animation:mpulse 1s infinite}
  @keyframes mpulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}

  /* Setup screen */
  .setup{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:24px;z-index:100}
  .setup.hidden{display:none}
  .setup-title{font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--accent);letter-spacing:.08em}
  .setup-sub{font-size:14px;color:var(--muted);text-align:center;max-width:300px;line-height:1.6}
  .setup-form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
  .setup-form input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-size:13px;font-family:'JetBrains Mono',monospace;outline:none}
  .setup-form input:focus{border-color:var(--accent)}
  .setup-form input::placeholder{color:var(--muted)}
  .btn{border:none;border-radius:10px;padding:14px;font-size:14px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;width:100%;transition:opacity .2s,transform .1s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .help{font-size:12px;color:var(--muted);text-align:center}

  /* Glow */
  .glow{position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
  .g1{top:-100px;left:-100px;background:var(--glow)}
  .g2{bottom:-100px;right:-100px;background:var(--glow2)}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<!-- Setup -->
<div class="setup" id="setup">
  <div class="setup-title">J.A.R.V.I.S</div>
  <div class="setup-sub">Cola o URL do servidor que aparece nos logs do GitHub Actions após iniciar o workflow.</div>
  <div class="setup-form">
    <!--
      NOTA PARA APK:
      As variáveis abaixo são injectadas em tempo de build pelo workflow build-apk.yml
      a partir dos GitHub Secrets. Não coloques valores reais aqui.
    -->
    <input id="inRepo"    placeholder="utilizador/repositorio" autocomplete="off">
    <input id="inToken"   placeholder="GitHub Token (ghp_...)" type="password" autocomplete="off">
    <input id="inServer"  placeholder="URL do servidor ngrok (após iniciar)" autocomplete="off">
    <button class="btn btn-primary" id="btnStart">🚀 Iniciar Jarvis</button>
    <button class="btn btn-ghost"   id="btnConn"  disabled>🔗 Ligar ao servidor</button>
  </div>
  <span class="help">O URL ngrok aparece nos logs do workflow após ~2 minutos</span>
</div>

<!-- App principal -->
<div class="app" id="app" style="display:none">
  <header>
    <span class="logo">J.A.R.V.I.S</span>
    <div class="status-pill">
      <div class="dot" id="dot"></div>
      <span id="stTxt">desligado</span>
    </div>
  </header>

  <div class="orb-area">
    <div class="orb-wrap">
      <div class="ring r3" id="r3"></div>
      <div class="ring r2" id="r2"></div>
      <div class="ring"    id="r1"></div>
      <div class="orb" id="orb"><div class="pulse" id="pulse"></div></div>
    </div>
    <div class="state-lbl" id="lbl">em espera</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="bottom-bar">
    <input class="txt-in" id="txtIn" placeholder="Escreve ou fala..." autocomplete="off">
    <button class="mic-btn" id="micBtn">🎤</button>
  </div>
</div>

<script>
// ── Configuração injectada pelo build-apk.yml via GitHub Secrets ──────────
// Durante o build em APK, o workflow substitui estas variáveis automaticamente.
// Em modo browser, o utilizador preenche manualmente no ecrã de setup.
const BUILD_CONFIG = {
  repo:   "%%GITHUB_REPO%%",    // substituído por: owner/repo-name
  token:  "%%GITHUB_TOKEN%%",   // substituído por: ghp_...
  server: "%%SERVER_URL%%"      // substituído por: URL fixo se existir
};

// ── Estado ────────────────────────────────────────────────────────────────
let ws = null, recog = null, isRec = false;
let repo = '', token = '', serverUrl = '';
const aCtx = new (window.AudioContext || window.webkitAudioContext)();

// ── Persistência ──────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('j_repo',   repo);
  localStorage.setItem('j_token',  token);
  localStorage.setItem('j_server', serverUrl);
}
function load() {
  // Se o APK injectou valores reais (não os placeholders), usa-os directamente
  const injRepo   = BUILD_CONFIG.repo   !== '%%GITHUB_REPO%%'   ? BUILD_CONFIG.repo   : '';
  const injToken  = BUILD_CONFIG.token  !== '%%GITHUB_TOKEN%%'  ? BUILD_CONFIG.token  : '';
  const injServer = BUILD_CONFIG.server !== '%%SERVER_URL%%'     ? BUILD_CONFIG.server : '';

  repo      = injRepo   || localStorage.getItem('j_repo')   || '';
  token     = injToken  || localStorage.getItem('j_token')  || '';
  serverUrl = injServer || localStorage.getItem('j_server') || '';

  if (repo)      document.getElementById('inRepo').value   = repo;
  if (token)     document.getElementById('inToken').value  = token;
  if (serverUrl) {
    document.getElementById('inServer').value = serverUrl;
    document.getElementById('btnConn').disabled = false;
  }

  // Se APK tem tudo configurado, vai directo para ligar
  if (injRepo && injToken && injServer) {
    ligar(injServer);
  }
}

// ── UI ────────────────────────────────────────────────────────────────────
function estado(e, txt) {
  const orb = document.getElementById('orb');
  const lbl = document.getElementById('lbl');
  const dot = document.getElementById('dot');
  orb.className = `orb ${e}`;
  lbl.className = `state-lbl ${e}`;
  lbl.textContent = txt;
  ['r1','r2','r3'].forEach(id =>
    document.getElementById(id).classList.toggle('on',
      ['listening','speaking','processing'].includes(e))
  );
  dot.className = 'dot ' + (['online','listening','speaking','processing'].includes(e)
    ? 'online' : e === 'error' ? 'error' : 'loading');
}

function addMsg(txt, quem, init=false) {
  const c = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = `msg ${quem}${init?' iniciativa':''}`;
  const m = document.createElement('div');
  m.className = 'msg-meta';
  m.textContent = quem === 'user' ? 'Tu' : (init ? '⚡ Jarvis' : 'Jarvis');
  d.appendChild(m);
  d.appendChild(document.createTextNode(txt));
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

// ── Áudio ─────────────────────────────────────────────────────────────────
async function tocar(b64) {
  const bytes = atob(b64);
  const buf = new Uint8Array(bytes.length);
  for (let i=0;i<bytes.length;i++) buf[i]=bytes.charCodeAt(i);
  const decoded = await aCtx.decodeAudioData(buf.buffer);
  const src = aCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(aCtx.destination);
  src.start();
  return new Promise(r => src.onended = r);
}

// ── WebSocket ─────────────────────────────────────────────────────────────
function ligar(url) {
  const wsUrl = url.replace(/^https?/,'wss').replace(/\/+$/,'') + '/ws';
  document.getElementById('stTxt').textContent = 'a ligar...';
  estado('loading','a ligar...');

  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    estado('online','online');
    document.getElementById('stTxt').textContent = 'online';
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('app').style.display = '';
    setInterval(() => ws?.readyState===1 && ws.send(JSON.stringify({tipo:'ping'})), 25000);
  };

  ws.onmessage = async (e) => {
    const d = JSON.parse(e.data);
    if (d.tipo === 'audio') {
      estado('speaking','a falar...');
      addMsg(d.texto, 'jarvis', d.iniciativa);
      await tocar(d.dados);
      estado('online','em espera');
    }
  };

  ws.onerror = () => { estado('error','erro'); document.getElementById('stTxt').textContent='erro'; };
  ws.onclose = () => { estado('','desligado'); document.getElementById('stTxt').textContent='desligado'; ws=null; };
}

function enviar(msg) {
  if (!ws || ws.readyState!==1) return;
  ws.send(JSON.stringify({tipo:'texto', mensagem:msg}));
  addMsg(msg,'user');
  estado('processing','a pensar...');
}

// ── Speech Recognition ────────────────────────────────────────────────────
function mic() {
  if (aCtx.state==='suspended') aCtx.resume();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Browser não suporta reconhecimento de voz.'); return; }

  if (isRec) { recog?.stop(); return; }

  recog = new SR();
  recog.lang = 'pt-PT';
  recog.continuous = false;
  recog.interimResults = true;

  recog.onstart = () => {
    isRec = true;
    document.getElementById('micBtn').classList.add('rec');
    estado('listening','a ouvir...');
  };
  recog.onresult = e => {
    const t = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('txtIn').value = t;
    if (e.results[e.results.length-1].isFinal) {
      enviar(t);
      document.getElementById('txtIn').value = '';
    }
  };
  recog.onend = () => {
    isRec = false;
    document.getElementById('micBtn').classList.remove('rec');
    if (ws?.readyState===1) estado('online','em espera');
  };
  recog.start();
}

// ── GitHub Actions — disparar workflow ───────────────────────────────────
async function iniciarWorkflow() {
  repo  = document.getElementById('inRepo').value.trim();
  token = document.getElementById('inToken').value.trim();
  save();
  if (!repo || !token) { alert('Preenche o repositório e o token.'); return; }

  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  btn.textContent = '⏳ A iniciar...';

  try {
    const r = await fetch(
      `https://api.github.com/repos/${repo}/actions/workflows/jarvis.yml/dispatches`,
      { method:'POST',
        headers:{ 'Authorization':`token ${token}`,
                  'Accept':'application/vnd.github.v3+json',
                  'Content-Type':'application/json' },
        body: JSON.stringify({ ref:'main', inputs:{ duracao:'180' } }) }
    );
    if (r.status===204) {
      btn.textContent = '✅ Workflow iniciado!';
      document.getElementById('btnConn').disabled = false;
      setTimeout(()=>{ btn.disabled=false; btn.textContent='🚀 Iniciar Jarvis'; }, 5000);
    } else {
      const err = await r.json();
      alert('Erro: ' + (err.message || r.status));
      btn.disabled=false; btn.textContent='🚀 Iniciar Jarvis';
    }
  } catch(e) {
    alert('Falha na ligação à API do GitHub.');
    btn.disabled=false; btn.textContent='🚀 Iniciar Jarvis';
  }
}

// ── Listeners ─────────────────────────────────────────────────────────────
document.getElementById('btnStart').addEventListener('click', iniciarWorkflow);

document.getElementById('btnConn').addEventListener('click', () => {
  serverUrl = document.getElementById('inServer').value.trim();
  save();
  if (serverUrl) ligar(serverUrl);
  else alert('Cola o URL ngrok dos logs do GitHub Actions.');
});

document.getElementById('inServer').addEventListener('input', e => {
  document.getElementById('btnConn').disabled = !e.target.value.trim();
});

document.getElementById('txtIn').addEventListener('keydown', e => {
  if (e.key==='Enter') {
    const msg = e.target.value.trim();
    if (msg) { enviar(msg); e.target.value=''; }
  }
});

document.getElementById('micBtn').addEventListener('click', mic);

// ── Init ──────────────────────────────────────────────────────────────────
load();
</script>
</body>
</html>
