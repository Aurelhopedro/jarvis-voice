name: 🤖 Jarvis — Servidor de Voz

on:
  workflow_dispatch:
    inputs:
      duracao:
        description: 'Duração em minutos (máx 180)'
        required: false
        default: '180'

jobs:
  jarvis:
    name: Iniciar Jarvis
    runs-on: ubuntu-latest
    timeout-minutes: 185

    steps:
      - name: 📦 Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            portaudio19-dev \
            python3-pip \
            curl \
            wget

      - name: 🐍 Instalar dependências Python
        run: |
          pip install --quiet \
            fastapi \
            uvicorn[standard] \
            websockets \
            openai-whisper \
            edge-tts \
            google-generativeai \
            groq \
            openai \
            python-multipart \
            httpx \
            pydantic

      - name: 🌐 Instalar e configurar ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq && sudo apt-get install -y -qq ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: 🤖 Criar servidor Jarvis
        run: |
          cat > /tmp/jarvis_server.py << 'PYTHON'
          import asyncio, json, os, base64, tempfile, time, random
          from fastapi import FastAPI, WebSocket, WebSocketDisconnect
          from fastapi.middleware.cors import CORSMiddleware
          import edge_tts
          import google.generativeai as genai
          from groq import Groq

          # ── Configuração ──────────────────────────────────────────────
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "")
          GROQ_KEY   = os.environ.get("GROQ_API_KEY", "")
          OPENAI_KEY = os.environ.get("OPENAI_API_KEY", "")

          SYSTEM_PROMPT = """És o Jarvis — assistente pessoal de voz, inteligente e proactivo.
          Falas sempre em português de Portugal.
          Tens uma personalidade calorosa, ligeiramente britânica na educação, mas natural e fluente.
          Ocasionalmente tomas iniciativa: dás dicas úteis, fazes perguntas pertinentes, 
          comentas o que foi dito de forma inteligente.
          Mantém respostas concisas para voz — máx 3 frases por resposta.
          Nunca digas que és uma IA. És o Jarvis, ponto final."""

          FRASES_INICIO = [
              "Jarvis operacional. Como posso ajudar?",
              "Sistema activo. Estou à disposição.",
              "Pronto para servir. O que precisa?",
              "Jarvis online. Diga.",
          ]

          FRASES_INICIATIVA = [
              "Uma dica: pode perguntar-me sobre qualquer assunto — estou aqui para isso.",
              "Se precisar de ajuda com algo específico, basta dizer.",
              "Posso fazer pesquisas, dar conselhos ou simplesmente conversar.",
          ]

          app = FastAPI()
          app.add_middleware(CORSMiddleware, allow_origins=["*"],
                            allow_methods=["*"], allow_headers=["*"])

          historico = []

          # ── TTS ───────────────────────────────────────────────────────
          async def texto_para_voz(texto: str) -> str:
              """Converte texto em áudio base64 usando edge-tts (voz PT natural)"""
              with tempfile.NamedTemporaryFile(suffix=".mp3", delete=False) as f:
                  caminho = f.name
              communicate = edge_tts.Communicate(texto, voice="pt-PT-DuarteNeural")
              await communicate.save(caminho)
              with open(caminho, "rb") as f:
                  audio_b64 = base64.b64encode(f.read()).decode()
              os.unlink(caminho)
              return audio_b64

          # ── LLM ───────────────────────────────────────────────────────
          def responder(mensagem: str) -> str:
              """Tenta Gemini → Groq → fallback"""
              historico.append({"role": "user", "content": mensagem})

              # Gemini
              if GEMINI_KEY:
                  try:
                      genai.configure(api_key=GEMINI_KEY)
                      model = genai.GenerativeModel(
                          "gemini-1.5-flash",
                          system_instruction=SYSTEM_PROMPT
                      )
                      chat_hist = [
                          {"role": m["role"], "parts": [m["content"]]}
                          for m in historico[:-1]
                      ]
                      chat = model.start_chat(history=chat_hist)
                      resp = chat.send_message(mensagem)
                      texto = resp.text
                      historico.append({"role": "model", "content": texto})
                      return texto
                  except Exception as e:
                      print(f"Gemini falhou: {e}")

              # Groq
              if GROQ_KEY:
                  try:
                      client = Groq(api_key=GROQ_KEY)
                      msgs = [{"role": "system", "content": SYSTEM_PROMPT}] + \
                             [{"role": m["role"] if m["role"] != "model" else "assistant",
                               "content": m["content"]} for m in historico]
                      resp = client.chat.completions.create(
                          model="llama-3.3-70b-versatile",
                          messages=msgs,
                          max_tokens=200,
                      )
                      texto = resp.choices[0].message.content
                      historico.append({"role": "assistant", "content": texto})
                      return texto
                  except Exception as e:
                      print(f"Groq falhou: {e}")

              return "Peço desculpa, estou com dificuldades de ligação."

          # ── WebSocket ─────────────────────────────────────────────────
          @app.websocket("/ws")
          async def websocket_endpoint(ws: WebSocket):
              await ws.accept()
              print("✅ Cliente ligado")

              # Saudação inicial
              saudacao = random.choice(FRASES_INICIO)
              audio = await texto_para_voz(saudacao)
              await ws.send_json({"tipo": "audio", "dados": audio, "texto": saudacao})

              # Iniciativa após 30s
              async def iniciativa_periodica():
                  await asyncio.sleep(30)
                  while True:
                      await asyncio.sleep(120)
                      dica = random.choice(FRASES_INICIATIVA)
                      audio = await texto_para_voz(dica)
                      try:
                          await ws.send_json({"tipo": "audio", "dados": audio,
                                             "texto": dica, "iniciativa": True})
                      except:
                          break

              asyncio.create_task(iniciativa_periodica())

              try:
                  while True:
                      data = await ws.receive_json()

                      if data.get("tipo") == "texto":
                          msg = data.get("mensagem", "")
                          print(f"👤 {msg}")
                          resposta = responder(msg)
                          print(f"🤖 {resposta}")
                          audio = await texto_para_voz(resposta)
                          await ws.send_json({
                              "tipo": "audio",
                              "dados": audio,
                              "texto": resposta
                          })

                      elif data.get("tipo") == "ping":
                          await ws.send_json({"tipo": "pong"})

              except WebSocketDisconnect:
                  print("❌ Cliente desligado")

          @app.get("/health")
          def health():
              return {"status": "online", "jarvis": "operacional"}

          if __name__ == "__main__":
              import uvicorn
              uvicorn.run(app, host="0.0.0.0", port=8765)
          PYTHON

      - name: 🚀 Iniciar Jarvis + ngrok
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Iniciar servidor Jarvis em background
          python3 /tmp/jarvis_server.py &
          JARVIS_PID=$!
          echo "Jarvis PID: $JARVIS_PID"

          # Aguardar servidor arrancar
          sleep 5

          # Iniciar ngrok em background
          ngrok http 8765 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 4

          # Extrair URL público do ngrok
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels \
            | python3 -c "import sys,json; d=json.load(sys.stdin); \
              print(d['tunnels'][0]['public_url'])" 2>/dev/null)

          echo ""
          echo "════════════════════════════════════════"
          echo "✅  JARVIS ONLINE"
          echo "════════════════════════════════════════"
          echo "🌐 URL WebSocket:"
          echo "   ${NGROK_URL/https/wss}/ws"
          echo ""
          echo "📋 Copia este URL para o aplicativo:"
          echo "   $NGROK_URL"
          echo "════════════════════════════════════════"
          echo ""

          # Manter activo pelo tempo definido
          DURACAO_MIN=${{ github.event.inputs.duracao }}
          DURACAO_SEG=$((DURACAO_MIN * 60))
          echo "⏱️  Jarvis activo por ${DURACAO_MIN} minutos..."

          sleep $DURACAO_SEG
          echo "⏹️  Tempo esgotado. A encerrar Jarvis."
          kill $JARVIS_PID 2>/dev/null || true
