name: 🤖 Jarvis — Servidor de Voz

on:
  workflow_dispatch:
    inputs:
      duracao:
        description: 'Duração em minutos (máx 180)'
        required: false
        default: '180'

jobs:
  jarvis:
    name: Iniciar Jarvis
    runs-on: ubuntu-latest
    timeout-minutes: 185

    steps:
      - name: 📦 Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            portaudio19-dev \
            python3-pip \
            curl \
            wget \
            libsndfile1

      - name: 🐍 Instalar dependências Python
        run: |
          pip install --quiet \
            fastapi \
            "uvicorn[standard]" \
            websockets \
            openai-whisper \
            edge-tts \
            google-generativeai \
            groq \
            openai \
            python-multipart \
            httpx \
            pydantic \
            numpy \
            soundfile \
            scipy

      - name: 🌐 Instalar e configurar ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq && sudo apt-get install -y -qq ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: 🤖 Criar servidor Jarvis com VAD + Whisper
        run: |
          cat > /tmp/jarvis_server.py << 'PYTHON'
import asyncio, json, os, base64, tempfile, random, io
import numpy as np
from fastapi import FastAPI, WebSocket, WebSocketDisconnect
from fastapi.middleware.cors import CORSMiddleware
import edge_tts
import whisper
import google.generativeai as genai
from groq import Groq

# ── Config ────────────────────────────────────────────────
GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "")
GROQ_KEY   = os.environ.get("GROQ_API_KEY", "")

SYSTEM_PROMPT = """És o Jarvis — assistente pessoal de voz, inteligente e proactivo.
Falas sempre em português de Portugal, com naturalidade e fluidez.
Tens personalidade calorosa, ligeiramente britânica na educação.
Tomas iniciativa: dás dicas, fazes perguntas pertinentes, comentas de forma inteligente.
Respostas curtas e directas para voz — máximo 3 frases.
Nunca digas que és uma IA. És o Jarvis."""

FRASES_INICIO = [
    "Jarvis operacional. Como posso ajudar?",
    "Sistema activo. Estou à disposição.",
    "Pronto para servir. O que precisa?",
    "Jarvis online. Diga.",
]

FRASES_INICIATIVA = [
    "Está tudo bem? Precisa de alguma coisa?",
    "Posso fazer pesquisas, dar conselhos ou simplesmente conversar.",
    "Se tiver alguma dúvida, estou aqui.",
    "Lembre-se que pode falar naturalmente — estou sempre a ouvir.",
]

# ── VAD — detecção de actividade de voz ──────────────────
class VAD:
    def __init__(self, sample_rate=16000, silence_ms=800, threshold=0.01):
        self.sample_rate  = sample_rate
        self.silence_samp = int(sample_rate * silence_ms / 1000)
        self.threshold    = threshold
        self.buffer       = []        # chunks de áudio (arrays numpy)
        self.silence_cnt  = 0
        self.speaking     = False

    def process(self, chunk: np.ndarray):
        """
        Recebe chunk de áudio float32.
        Devolve o buffer completo quando detecta fim de fala, senão None.
        """
        rms = float(np.sqrt(np.mean(chunk ** 2)))

        if rms > self.threshold:
            self.speaking   = True
            self.silence_cnt = 0
            self.buffer.append(chunk)
        elif self.speaking:
            self.silence_cnt += len(chunk)
            self.buffer.append(chunk)
            if self.silence_cnt >= self.silence_samp:
                # Fim de fala detectado
                audio = np.concatenate(self.buffer)
                self.buffer      = []
                self.silence_cnt = 0
                self.speaking    = False
                return audio
        return None

    def reset(self):
        self.buffer      = []
        self.silence_cnt = 0
        self.speaking    = False

# ── Whisper (carregado uma vez) ───────────────────────────
print("⏳ A carregar modelo Whisper...")
whisper_model = whisper.load_model("base")
print("✅ Whisper pronto")

# ── App ───────────────────────────────────────────────────
app = FastAPI()
app.add_middleware(CORSMiddleware, allow_origins=["*"],
                   allow_methods=["*"], allow_headers=["*"])

# ── TTS ───────────────────────────────────────────────────
async def tts(texto: str) -> str:
    with tempfile.NamedTemporaryFile(suffix=".mp3", delete=False) as f:
        path = f.name
    comm = edge_tts.Communicate(texto, voice="pt-PT-DuarteNeural")
    await comm.save(path)
    with open(path, "rb") as f:
        b64 = base64.b64encode(f.read()).decode()
    os.unlink(path)
    return b64

# ── STT (Whisper) ─────────────────────────────────────────
def stt(audio: np.ndarray) -> str:
    result = whisper_model.transcribe(
        audio,
        language="pt",
        fp16=False,
        condition_on_previous_text=False
    )
    return result["text"].strip()

# ── LLM ──────────────────────────────────────────────────
historico = []

def llm(mensagem: str) -> str:
    historico.append({"role": "user", "content": mensagem})

    # Gemini primeiro
    if GEMINI_KEY:
        try:
            genai.configure(api_key=GEMINI_KEY)
            model = genai.GenerativeModel(
                "gemini-1.5-flash",
                system_instruction=SYSTEM_PROMPT
            )
            hist = [{"role": m["role"], "parts": [m["content"]]}
                    for m in historico[:-1]]
            chat = model.start_chat(history=hist)
            resp = chat.send_message(mensagem)
            texto = resp.text
            historico.append({"role": "model", "content": texto})
            return texto
        except Exception as e:
            print(f"Gemini falhou: {e}")

    # Groq fallback
    if GROQ_KEY:
        try:
            client = Groq(api_key=GROQ_KEY)
            msgs = [{"role": "system", "content": SYSTEM_PROMPT}] + [
                {"role": m["role"] if m["role"] != "model" else "assistant",
                 "content": m["content"]} for m in historico
            ]
            resp = client.chat.completions.create(
                model="llama-3.3-70b-versatile",
                messages=msgs,
                max_tokens=200,
            )
            texto = resp.choices[0].message.content
            historico.append({"role": "assistant", "content": texto})
            return texto
        except Exception as e:
            print(f"Groq falhou: {e}")

    return "Peço desculpa, estou com dificuldades de ligação."

# ── WebSocket ─────────────────────────────────────────────
@app.websocket("/ws")
async def ws_endpoint(ws: WebSocket):
    await ws.accept()
    print("✅ Cliente ligado")

    vad = VAD(sample_rate=16000, silence_ms=800, threshold=0.01)

    # Saudação inicial
    saudacao = random.choice(FRASES_INICIO)
    audio_b64 = await tts(saudacao)
    await ws.send_json({
        "tipo": "audio",
        "dados": audio_b64,
        "texto": saudacao
    })

    # Iniciativa periódica (a cada 2 minutos de silêncio)
    async def iniciativa():
        await asyncio.sleep(60)
        while True:
            await asyncio.sleep(120)
            dica = random.choice(FRASES_INICIATIVA)
            b64 = await tts(dica)
            try:
                await ws.send_json({
                    "tipo": "audio",
                    "dados": b64,
                    "texto": dica,
                    "iniciativa": True
                })
            except:
                break

    asyncio.create_task(iniciativa())

    try:
        while True:
            data = await ws.receive_json()
            tipo = data.get("tipo")

            # ── Chunk de áudio (escuta contínua) ──────────
            if tipo == "audio_chunk":
                # Áudio chega como float32 base64
                raw   = base64.b64decode(data["dados"])
                chunk = np.frombuffer(raw, dtype=np.float32)

                resultado = vad.process(chunk)
                if resultado is not None and len(resultado) > 3200:
                    # Notifica que está a processar
                    await ws.send_json({"tipo": "estado", "estado": "processando"})

                    # STT
                    texto_user = stt(resultado)
                    print(f"👤 {texto_user}")

                    if texto_user and len(texto_user) > 2:
                        await ws.send_json({
                            "tipo": "transcricao",
                            "texto": texto_user
                        })

                        # LLM
                        resposta = llm(texto_user)
                        print(f"🤖 {resposta}")

                        # TTS
                        b64 = await tts(resposta)
                        await ws.send_json({
                            "tipo": "audio",
                            "dados": b64,
                            "texto": resposta
                        })
                    else:
                        await ws.send_json({"tipo": "estado", "estado": "ouvindo"})

            # ── Texto directo (fallback teclado) ──────────
            elif tipo == "texto":
                msg = data.get("mensagem", "").strip()
                if msg:
                    print(f"👤 [texto] {msg}")
                    await ws.send_json({"tipo": "transcricao", "texto": msg})
                    resposta = llm(msg)
                    print(f"🤖 {resposta}")
                    b64 = await tts(resposta)
                    await ws.send_json({
                        "tipo": "audio",
                        "dados": b64,
                        "texto": resposta
                    })

            elif tipo == "ping":
                await ws.send_json({"tipo": "pong"})

            elif tipo == "vad_reset":
                vad.reset()

    except WebSocketDisconnect:
        print("❌ Cliente desligado")

@app.get("/health")
def health():
    return {"status": "online", "jarvis": "operacional", "whisper": "pronto"}

if __name__ == "__main__":
    import uvicorn
    uvicorn.run(app, host="0.0.0.0", port=8765)
PYTHON

      - name: 🚀 Iniciar Jarvis + ngrok
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 /tmp/jarvis_server.py &
          JARVIS_PID=$!
          echo "Jarvis PID: $JARVIS_PID"

          # Aguardar servidor + modelo Whisper carregarem
          sleep 20

          # Iniciar ngrok
          ngrok http 8765 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5

          # Extrair URL público
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels \
            | python3 -c "import sys,json; d=json.load(sys.stdin); \
              print(d['tunnels'][0]['public_url'])" 2>/dev/null)

          echo ""
          echo "════════════════════════════════════════"
          echo "✅  JARVIS ONLINE"
          echo "════════════════════════════════════════"
          echo "JARVIS_URL=$NGROK_URL"
          echo "WS_URL=${NGROK_URL/https/wss}/ws"
          echo "════════════════════════════════════════"
          echo ""

          DURACAO_MIN=${{ github.event.inputs.duracao }}
          DURACAO_SEG=$((DURACAO_MIN * 60))
          echo "⏱️  Jarvis activo por ${DURACAO_MIN} minutos..."
          sleep $DURACAO_SEG

          echo "⏹️  Tempo esgotado. A encerrar."
          kill $JARVIS_PID 2>/dev/null || true
