name: Jarvis Voice Server

on:
  workflow_dispatch:

jobs:
  jarvis:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Instalar Python e dependências
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn websockets \
            openai-whisper \
            edge-tts \
            google-genai \
            groq \
            numpy \
            httpx

      - name: Testar APIs (Gemini e Groq)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, sys

          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "")
          GROQ_KEY   = os.environ.get("GROQ_API_KEY", "")

          print("=" * 60)
          print("TESTE DE APIs — DIAGNÓSTICO")
          print("=" * 60)
          print(f"GEMINI_API_KEY: {'DEFINIDA (' + str(len(GEMINI_KEY)) + ' chars)' if GEMINI_KEY else '*** NAO DEFINIDA ***'}")
          print(f"GROQ_API_KEY:   {'DEFINIDA (' + str(len(GROQ_KEY)) + ' chars)' if GROQ_KEY else '*** NAO DEFINIDA ***'}")
          print()

          gemini_ok = False
          groq_ok   = False

          if GEMINI_KEY:
              print("[GEMINI] A testar gemini-2.5-flash (google-genai)...")
              try:
                  from google import genai as google_genai
                  client = google_genai.Client(api_key=GEMINI_KEY)
                  r = client.models.generate_content(
                      model="gemini-2.5-flash",
                      contents="Responde apenas com a palavra: OK"
                  )
                  print(f"[GEMINI] OK — resposta: {r.text.strip()[:50]}")
                  gemini_ok = True
              except Exception as e:
                  print(f"[GEMINI] FALHOU: {type(e).__name__}: {e}")
          else:
              print("[GEMINI] Sem chave — a saltar")

          if GROQ_KEY:
              print("[GROQ]   A testar modelos disponíveis...")
              from groq import Groq
              client = Groq(api_key=GROQ_KEY)
              # Modelos actuais Groq (Novembro 2026) — por ordem de preferência
              modelos_groq = [
                  "llama-3.3-70b-versatile",
                  "meta-llama/llama-4-scout-17b-16e-instruct",
                  "llama-3.1-8b-instant",
              ]
              for modelo in modelos_groq:
                  try:
                      r = client.chat.completions.create(
                          model=modelo,
                          messages=[{"role": "user", "content": "Responde apenas com a palavra: OK"}],
                          max_tokens=10
                      )
                      print(f"[GROQ]   OK com '{modelo}' — resposta: {r.choices[0].message.content.strip()[:50]}")
                      groq_ok = True
                      with open("/tmp/groq_model.txt", "w") as f:
                          f.write(modelo)
                      break
                  except Exception as e:
                      print(f"[GROQ]   '{modelo}' FALHOU: {type(e).__name__}: {e}")
          else:
              print("[GROQ]   Sem chave — a saltar")

          print()
          print("=" * 60)
          if not gemini_ok and not groq_ok:
              print("RESULTADO: AMBAS AS APIs FALHARAM")
              sys.exit(1)
          elif gemini_ok:
              print("RESULTADO: Gemini OK — LLM operacional")
          elif groq_ok:
              print("RESULTADO: Groq OK — LLM operacional")
          print("=" * 60)
          PYEOF

      - name: Instalar cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Iniciar servidor Jarvis e túnel Cloudflare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JARVIS_GITHUB_TOKEN: ${{ secrets.JARVIS_GITHUB_TOKEN }}
          JARVIS_GITHUB_REPO: ${{ secrets.JARVIS_GITHUB_REPO }}
        run: |
          # Iniciar servidor
          python3 scripts/jarvis_server.py &
          SERVER_PID=$!
          echo "Servidor PID: $SERVER_PID"

          # Aguardar servidor arrancar
          echo "A aguardar que o servidor arranque..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8765/health > /dev/null 2>&1; then
              echo "Servidor pronto!"
              break
            fi
            sleep 2
          done

          # Iniciar túnel Cloudflare
          cloudflared tunnel --url http://localhost:8765 --no-autoupdate 2>&1 | tee /tmp/cloudflared.log &
          TUNNEL_PID=$!

          # Aguardar URL do túnel
          echo "A aguardar URL do túnel..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "Túnel activo: $TUNNEL_URL"
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERRO: Não foi possível obter URL do túnel"
            exit 1
          fi

          # Publicar URL no repositório
          echo "$TUNNEL_URL" > jarvis-url.txt
          git config user.email "jarvis@github-actions"
          git config user.name "Jarvis Actions"
          git add jarvis-url.txt
          git commit -m "chore: actualizar URL Jarvis [skip ci]"
          git push https://x-access-token:${JARVIS_GITHUB_TOKEN}@github.com/${JARVIS_GITHUB_REPO}.git HEAD:main

          echo "URL publicada: $TUNNEL_URL"
          echo "Jarvis operacional. A manter activo..."

          # Manter activo
          wait $SERVER_PID
