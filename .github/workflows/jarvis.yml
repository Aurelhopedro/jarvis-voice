      - name: Testar APIs (Gemini e Groq)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, sys

          GEMINI_KEY = os.environ.get("GEMINI_API_KEY", "")
          GROQ_KEY   = os.environ.get("GROQ_API_KEY", "")

          print("=" * 60)
          print("TESTE DE APIs — DIAGNÓSTICO")
          print("=" * 60)
          print(f"GEMINI_API_KEY: {'DEFINIDA (' + str(len(GEMINI_KEY)) + ' chars)' if GEMINI_KEY else '*** NAO DEFINIDA ***'}")
          print(f"GROQ_API_KEY:   {'DEFINIDA (' + str(len(GROQ_KEY)) + ' chars)' if GROQ_KEY else '*** NAO DEFINIDA ***'}")
          print()

          gemini_ok = False
          groq_ok   = False

          if GEMINI_KEY:
              print("[GEMINI] A testar gemini-2.5-flash (google-genai)...")
              try:
                  from google import genai as google_genai
                  client = google_genai.Client(api_key=GEMINI_KEY)
                  r = client.models.generate_content(
                      model="gemini-2.5-flash-preview-05-20",
                      contents="Responde apenas com a palavra: OK"
                  )
                  print(f"[GEMINI] OK — resposta: {r.text.strip()[:50]}")
                  gemini_ok = True
              except Exception as e:
                  print(f"[GEMINI] FALHOU: {type(e).__name__}: {e}")
          else:
              print("[GEMINI] Sem chave — a saltar")

          if GROQ_KEY:
              print("[GROQ]   A testar modelos disponíveis...")
              from groq import Groq
              client = Groq(api_key=GROQ_KEY)
              # Tentar modelos por ordem de preferência
              modelos_groq = [
                  "llama-3.3-70b-versatile",
                  "llama3-groq-70b-8192-tool-use-preview",
                  "llama-3.1-70b-versatile",
                  "mixtral-8x7b-32768",
              ]
              for modelo in modelos_groq:
                  try:
                      r = client.chat.completions.create(
                          model=modelo,
                          messages=[{"role": "user", "content": "Responde apenas com a palavra: OK"}],
                          max_tokens=10
                      )
                      print(f"[GROQ]   OK com '{modelo}' — resposta: {r.choices[0].message.content.strip()[:50]}")
                      groq_ok = True
                      # Guardar o modelo que funciona para usar no servidor
                      with open("/tmp/groq_model.txt", "w") as f:
                          f.write(modelo)
                      break
                  except Exception as e:
                      print(f"[GROQ]   '{modelo}' FALHOU: {type(e).__name__}: {e}")
          else:
              print("[GROQ]   Sem chave — a saltar")

          print()
          print("=" * 60)
          if not gemini_ok and not groq_ok:
              print("RESULTADO: AMBAS AS APIs FALHARAM")
          elif gemini_ok:
              print("RESULTADO: Gemini OK — LLM operacional")
          elif groq_ok:
              print("RESULTADO: Groq OK — LLM operacional")
          print("=" * 60)
          PYEOF