name: Jarvis Servidor de Voz

on:
  workflow_dispatch:
    inputs:
      duracao:
        description: 'Duracao em minutos (max 180)'
        required: false
        default: '180'

jobs:
  jarvis:
    name: Iniciar Jarvis
    runs-on: ubuntu-latest
    timeout-minutes: 185

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg portaudio19-dev python3-pip curl wget libsndfile1

      - name: Instalar dependencias Python
        run: |
          pip install --quiet \
            fastapi \
            "uvicorn[standard]" \
            websockets \
            openai-whisper \
            edge-tts \
            google-generativeai \
            groq \
            openai \
            python-multipart \
            httpx \
            pydantic \
            numpy \
            soundfile \
            scipy

      - name: Instalar Cloudflare Tunnel
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Iniciar Jarvis e Cloudflare Tunnel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.JARVIS_GITHUB_TOKEN }}
          GH_REPO: ${{ secrets.JARVIS_GITHUB_REPO }}
        run: |
          python3 scripts/jarvis_server.py &
          JARVIS_PID=$!

          # Aguardar o Whisper carregar — polling ao /health em vez de sleep fixo
          echo "A aguardar o Whisper carregar..."
          PRONTO=0
          for i in $(seq 1 30); do
            sleep 10
            if curl -s http://localhost:8765/health 2>/dev/null | grep -q '"online"'; then
              echo "Servidor pronto ao fim de $((i*10))s!"
              PRONTO=1
              break
            fi
            echo "  Ainda a carregar... ($((i*10))s)"
          done

          if [ "$PRONTO" -eq 0 ]; then
            echo "ERRO: servidor nao ficou pronto em 5 minutos. A abortar."
            kill $JARVIS_PID 2>/dev/null || true
            exit 1
          fi

          # Só agora arranca o túnel — servidor garantidamente pronto
          cloudflared tunnel --url http://localhost:8765 --no-autoupdate \
            --logfile /tmp/cloudflared.log 2>&1 &
          sleep 10

          CF_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -1)

          if [ -z "$CF_URL" ]; then
            echo "ERRO: Cloudflare nao gerou URL. A abortar."
            kill $JARVIS_PID 2>/dev/null || true
            exit 1
          fi

          echo "JARVIS ONLINE"
          echo "JARVIS_URL=$CF_URL"
          echo "WS_URL=${CF_URL/https/wss}/ws"

          # Obter SHA actual do ficheiro
          SHA=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GH_REPO/contents/jarvis-url.txt" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          # Publicar URL no jarvis-url.txt
          if [ -n "$SHA" ]; then
            RESULT=$(curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GH_REPO/contents/jarvis-url.txt" \
              -d "{\"message\":\"url: $CF_URL\",\"content\":\"$(echo -n "$CF_URL" | base64 -w 0)\",\"sha\":\"$SHA\",\"branch\":\"main\"}")
          else
            RESULT=$(curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GH_REPO/contents/jarvis-url.txt" \
              -d "{\"message\":\"url: $CF_URL\",\"content\":\"$(echo -n "$CF_URL" | base64 -w 0)\",\"branch\":\"main\"}")
          fi

          # Verificar se publicou com sucesso
          if echo "$RESULT" | grep -q '"content"'; then
            echo "URL publicada com sucesso no repo: $CF_URL"
          else
            echo "AVISO: Pode ter falhado a publicar URL. Resposta:"
            echo "$RESULT"
          fi

          DURACAO_MIN=${{ github.event.inputs.duracao }}
          DURACAO_SEG=$((DURACAO_MIN * 60))
          echo "Jarvis activo por ${DURACAO_MIN} minutos..."
          sleep $DURACAO_SEG

          # Limpar URL ao encerrar
          SHA2=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GH_REPO/contents/jarvis-url.txt" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$SHA2" ]; then
            curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GH_REPO/contents/jarvis-url.txt" \
              -d "{\"message\":\"offline\",\"content\":\"$(echo -n "offline" | base64 -w 0)\",\"sha\":\"$SHA2\",\"branch\":\"main\"}" \
              > /dev/null
          fi

          kill $JARVIS_PID 2>/dev/null || true
          echo "Jarvis encerrado."
