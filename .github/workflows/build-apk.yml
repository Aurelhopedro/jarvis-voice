name: 📱 Build APK — Jarvis Voice

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar ferramentas de build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zipalign apksigner imagemagick

      - name: 🔑 Criar keystore para assinar o APK
        run: |
          keytool -genkeypair \
            -alias jarvis \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore /tmp/jarvis.keystore \
            -storepass jarvispass \
            -keypass jarvispass \
            -dname "CN=Jarvis, OU=Voice, O=Aurelhopedro, L=PT, S=PT, C=PT" \
            -noprompt

      - name: 🏗️ Criar estrutura do projeto Android
        run: |
          mkdir -p app/src/main/{java/com/aurelhopedro/jarvis,res/{layout,values,mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi},assets}

          # ── AndroidManifest.xml ──────────────────────────
          cat > app/src/main/AndroidManifest.xml << 'XML'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.aurelhopedro.jarvis">

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />

    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="Jarvis"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true"
        android:hardwareAccelerated="true">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|keyboardHidden"
            android:screenOrientation="portrait"
            android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
XML

          # ── MainActivity.java — aponta para GitHub Pages ──
          cat > app/src/main/java/com/aurelhopedro/jarvis/MainActivity.java << 'JAVA'
package com.aurelhopedro.jarvis;

import android.app.Activity;
import android.content.pm.PackageManager;
import android.os.Bundle;
import android.webkit.*;
import android.view.*;
import android.widget.FrameLayout;
import android.Manifest;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import android.graphics.Color;

public class MainActivity extends Activity {

    private WebView webView;
    private static final int MIC_PERMISSION = 1001;

    // ✅ URL do GitHub Pages — nunca muda, não precisa recompilar
    private static final String JARVIS_URL = "https://aurelhopedro.github.io/jarvis-voice/";

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        // Ecrã completo imersivo
        getWindow().setFlags(
            WindowManager.LayoutParams.FLAG_FULLSCREEN,
            WindowManager.LayoutParams.FLAG_FULLSCREEN
        );
        getWindow().getDecorView().setSystemUiVisibility(
            View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
            View.SYSTEM_UI_FLAG_FULLSCREEN |
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
        );
        getWindow().setStatusBarColor(Color.parseColor("#0a0f1e"));
        getWindow().setNavigationBarColor(Color.parseColor("#0a0f1e"));

        // Layout
        FrameLayout layout = new FrameLayout(this);
        layout.setBackgroundColor(Color.parseColor("#0a0f1e"));
        setContentView(layout);

        // WebView
        webView = new WebView(this);
        layout.addView(webView, new FrameLayout.LayoutParams(
            FrameLayout.LayoutParams.MATCH_PARENT,
            FrameLayout.LayoutParams.MATCH_PARENT
        ));

        // Configurações WebView
        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setMediaPlaybackRequiresUserGesture(false);
        s.setAllowFileAccess(true);
        s.setAllowContentAccess(true);
        s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
        s.setCacheMode(WebSettings.LOAD_DEFAULT);
        s.setUserAgentString("JarvisApp/1.0 Android");

        // Chrome Client — aprova microfone automaticamente
        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public void onPermissionRequest(PermissionRequest request) {
                request.grant(request.getResources());
            }
        });

        webView.setWebViewClient(new WebViewClient() {
            @Override
            public boolean shouldOverrideUrlLoading(WebView view, String url) {
                return false;
            }
        });

        // Pedir permissão de microfone ao Android
        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                != PackageManager.PERMISSION_GRANTED) {
            ActivityCompat.requestPermissions(this,
                new String[]{Manifest.permission.RECORD_AUDIO}, MIC_PERMISSION);
        } else {
            carregarJarvis();
        }
    }

    private void carregarJarvis() {
        webView.loadUrl(JARVIS_URL);
    }

    @Override
    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] results) {
        if (requestCode == MIC_PERMISSION) {
            carregarJarvis();
        }
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }

    @Override
    protected void onPause() { super.onPause(); webView.onPause(); }

    @Override
    protected void onResume() { super.onResume(); webView.onResume(); }

    @Override
    protected void onDestroy() { webView.destroy(); super.onDestroy(); }
}
JAVA

