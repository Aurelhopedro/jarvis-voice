name: "Build APK Jarvis Voice"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'scripts/**'

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar ferramentas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wget unzip

      - name: Instalar Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export PATH="$PATH:$HOME/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Criar keystore
        run: |
          keytool -genkeypair -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore /tmp/jarvis.keystore -storepass jarvispass -keypass jarvispass \
            -dname "CN=Jarvis,OU=Voice,O=Aurelhopedro,L=PT,S=PT,C=PT" -noprompt

      - name: Preparar estrutura de pastas
        run: |
          mkdir -p src/com/aurelhopedro/jarvis
          mkdir -p res/values
          mkdir -p bin/classes
          mkdir -p bin/dex
          cp scripts/MainActivity.java src/com/aurelhopedro/jarvis/
          cp scripts/AndroidManifest.xml .
          cp scripts/strings.xml res/values/

      - name: Gerar icones
        run: python3 scripts/gerar_icones.py

      - name: Compilar Java
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          javac -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR" \
            -d bin/classes \
            src/com/aurelhopedro/jarvis/MainActivity.java
          echo "Java compilado OK"

      - name: Converter para DEX
        run: |
          d8 --output bin/dex \
             --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
             $(find bin/classes -name "*.class")
          echo "DEX gerado OK"

      - name: Compilar recursos
        run: |
          aapt package -f \
            -M AndroidManifest.xml \
            -S res \
            -I "$ANDROID_HOME/platforms/android-34/android.jar" \
            -F /tmp/jarvis-unaligned.apk
          echo "Recursos compilados OK"

      - name: Adicionar DEX ao APK
        run: |
          cp bin/dex/classes.dex .
          zip -qj /tmp/jarvis-unaligned.apk classes.dex
          echo "DEX adicionado ao APK"

      - name: Alinhar e assinar
        run: |
          zipalign -v 4 /tmp/jarvis-unaligned.apk /tmp/jarvis-aligned.apk
          apksigner sign \
            --ks /tmp/jarvis.keystore \
            --ks-pass pass:jarvispass \
            --key-pass pass:jarvispass \
            --ks-key-alias jarvis \
            --out /tmp/Jarvis.apk \
            /tmp/jarvis-aligned.apk
          echo "APK final:"
          ls -lh /tmp/Jarvis.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: /tmp/Jarvis.apk
          retention-days: 90
