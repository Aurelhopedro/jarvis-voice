name: "Build APK Jarvis Voice"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar ferramentas do sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zipalign apksigner imagemagick wget unzip

      - name: Instalar Android SDK manualmente
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools" >> $GITHUB_ENV
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Criar keystore
        run: |
          keytool -genkeypair -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore /tmp/jarvis.keystore -storepass jarvispass -keypass jarvispass \
            -dname "CN=Jarvis,OU=Voice,O=Aurelhopedro,L=PT,S=PT,C=PT" -noprompt

      - name: Criar estrutura Android
        run: |
          mkdir -p app/src/main/java/com/aurelhopedro/jarvis
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

          cat > /tmp/gerar_ficheiros.py << 'PYEOF'
          import os

          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.aurelhopedro.jarvis">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Jarvis"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""

          main_activity = """package com.aurelhopedro.jarvis;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.*;
          import android.view.*;
          import android.widget.FrameLayout;
          import android.Manifest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int MIC_PERMISSION = 1001;
              private static final String JARVIS_URL = "https://aurelhopedro.github.io/jarvis-voice/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  getWindow().setStatusBarColor(Color.parseColor("#0a0f1e"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0a0f1e"));
                  FrameLayout layout = new FrameLayout(this);
                  layout.setBackgroundColor(Color.parseColor("#0a0f1e"));
                  setContentView(layout);
                  webView = new WebView(this);
                  layout.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setUserAgentString("JarvisApp/1.0 Android");
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) { return false; }
                  });
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, MIC_PERMISSION);
                  } else { carregarJarvis(); }
              }

              private void carregarJarvis() { webView.loadUrl(JARVIS_URL); }

              @Override
              public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
                  if (req == MIC_PERMISSION) carregarJarvis();
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onPause() { super.onPause(); webView.onPause(); }
              @Override protected void onResume() { super.onResume(); webView.onResume(); }
              @Override protected void onDestroy() { webView.destroy(); super.onDestroy(); }
          }"""

          styles = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">#0a0f1e</item>
                  <item name="android:statusBarColor">#0a0f1e</item>
                  <item name="android:navigationBarColor">#0a0f1e</item>
              </style>
          </resources>"""

          strings = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Jarvis</string>
          </resources>"""

          with open("app/src/main/AndroidManifest.xml", "w") as f: f.write(manifest)
          with open("app/src/main/java/com/aurelhopedro/jarvis/MainActivity.java", "w") as f: f.write(main_activity)
          with open("app/src/main/res/values/styles.xml", "w") as f: f.write(styles)
          with open("app/src/main/res/values/strings.xml", "w") as f: f.write(strings)
          print("Ficheiros criados com sucesso")
          PYEOF
          python3 /tmp/gerar_ficheiros.py

      - name: Criar icones
        run: |
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dir="${entry%%:*}"; size="${entry##*:}"
            convert -size ${size}x${size} radial-gradient:"#1a3a6b"-"#0a0f1e" \
              -fill "#3b82f6" -pointsize $((size/3)) -gravity center -annotate 0 "J" \
              app/src/main/res/mipmap-${dir}/ic_launcher.png 2>/dev/null \
              || touch app/src/main/res/mipmap-${dir}/ic_launcher.png
          done

      - name: Criar Gradle
        run: |
          cat > /tmp/gerar_gradle.py << 'PYEOF'
          import os

          settings = 'rootProject.name = "JarvisVoice"\ninclude \':app\'\n'
          build_root = """buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          """
          build_app = """plugins { id 'com.android.application' }
          android {
              namespace 'com.aurelhopedro.jarvis'
              compileSdk 34
              defaultConfig {
                  applicationId "com.aurelhopedro.jarvis"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.core:core:1.12.0' }
          """
          wrapper = """distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          """
          os.makedirs("gradle/wrapper", exist_ok=True)
          with open("settings.gradle", "w") as f: f.write(settings)
          with open("build.gradle", "w") as f: f.write(build_root)
          with open("app/build.gradle", "w") as f: f.write(build_app)
          with open("gradle/wrapper/gradle-wrapper.properties", "w") as f: f.write(wrapper)
          print("Gradle criado")
          PYEOF
          python3 /tmp/gerar_gradle.py
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew -o gradlew
          chmod +x gradlew

      - name: Compilar APK
        run: |
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_HOME=/opt/android-sdk
          ./gradlew assembleRelease --no-daemon

      - name: Assinar APK
        run: |
          zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/jarvis-aligned.apk
          apksigner sign \
            --ks /tmp/jarvis.keystore \
            --ks-pass pass:jarvispass \
            --key-pass pass:jarvispass \
            --ks-key-alias jarvis \
            --out /tmp/Jarvis.apk \
            /tmp/jarvis-aligned.apk
          echo "APK pronto:"
          ls -lh /tmp/Jarvis.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: /tmp/Jarvis.apk
          retention-days: 90
