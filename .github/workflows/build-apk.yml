          # ── Ícone simples SVG → PNG ───────────────────────
          sudo apt-get install -y -qq imagemagick 2>/dev/null || true
          for size in 48 72 96 144 192; do
            convert -size ${size}x${size} \
              radial-gradient:'#1a3a6b'-'#0a0f1e' \
              -fill '#3b82f6' -pointsize $((size/3)) \
              -gravity center -annotate 0 'J' \
              app/src/main/res/mipmap-$(
                case $size in
                  48) echo mdpi;; 72) echo hdpi;; 96) echo xhdpi;;
                  144) echo xxhdpi;; 192) echo xxxhdpi;;
                esac
              )/ic_launcher.png 2>/dev/null || \
            cp /dev/null app/src/main/res/mipmap-$(
              case $size in
                48) echo mdpi;; 72) echo hdpi;; 96) echo xhdpi;;
                144) echo xxhdpi;; 192) echo xxxhdpi;;
              esac
            )/ic_launcher.png
          done

          # ── Copiar index.html para assets ─────────────────
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          echo "✅ index.html copiado para assets"

      - name: 🔧 Criar build.gradle e settings
        run: |
          # settings.gradle
          cat > settings.gradle << 'GRADLE'
rootProject.name = "JarvisVoice"
include ':app'
GRADLE

          # build.gradle (root)
          cat > build.gradle << 'GRADLE'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}
allprojects {
    repositories { google(); mavenCentral() }
}
GRADLE

          # app/build.gradle
          cat > app/build.gradle << 'GRADLE'
plugins {
    id 'com.android.application'
}
android {
    namespace 'com.aurelhopedro.jarvis'
    compileSdk 34
    defaultConfig {
        applicationId "com.aurelhopedro.jarvis"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.12.0'
}
GRADLE

          # gradle wrapper
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
PROPS

          # gradlew
          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew -o gradlew
          chmod +x gradlew

      - name: 🔨 Compilar APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "✅ APK compilado"

      - name: ✍️ Assinar e alinhar APK
        run: |
          # Zipalign
          zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/jarvis-aligned.apk

          # Assinar
          apksigner sign \
            --ks /tmp/jarvis.keystore \
            --ks-pass pass:jarvispass \
            --key-pass pass:jarvispass \
            --ks-key-alias jarvis \
            --out /tmp/Jarvis.apk \
            /tmp/jarvis-aligned.apk

          echo "✅ APK assinado: Jarvis.apk"
          ls -lh /tmp/Jarvis.apk

      - name: 📤 Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: /tmp/Jarvis.apk
          retention-days: 30

      - name: 📋 Sumário final
        run: |
          echo "════════════════════════════════════════"
          echo "✅  BUILD CONCLUÍDO"
          echo "════════════════════════════════════════"
          echo "📱 APK: Jarvis.apk"
          echo "📦 Tamanho: $(du -sh /tmp/Jarvis.apk | cut -f1)"
          echo "🔑 Secrets injectados: JARVIS_GITHUB_REPO + JARVIS_GITHUB_TOKEN"
          echo "☁️  Túnel: Cloudflare (grátis, sem conta)"
          echo "════════════════════════════════════════"
