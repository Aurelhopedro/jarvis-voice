XML

          # ── Ícone ─────────────────────────────────────────
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            size=48
            case $dir in hdpi) size=72;; xhdpi) size=96;; xxhdpi) size=144;; xxxhdpi) size=192;; esac
            convert -size ${size}x${size} \
              radial-gradient:'#1a3a6b'-'#0a0f1e' \
              -fill '#3b82f6' -pointsize $((size/3)) \
              -gravity center -annotate 0 'J' \
              app/src/main/res/mipmap-${dir}/ic_launcher.png 2>/dev/null || \
            touch app/src/main/res/mipmap-${dir}/ic_launcher.png
          done

      - name: 🔧 Criar ficheiros Gradle
        run: |
          cat > settings.gradle << 'GRADLE'
rootProject.name = "JarvisVoice"
include ':app'
GRADLE

          cat > build.gradle << 'GRADLE'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
}
allprojects { repositories { google(); mavenCentral() } }
GRADLE

          cat > app/build.gradle << 'GRADLE'
plugins { id 'com.android.application' }
android {
    namespace 'com.aurelhopedro.jarvis'
    compileSdk 34
    defaultConfig {
        applicationId "com.aurelhopedro.jarvis"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.core:core:1.12.0' }
GRADLE

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
PROPS

          curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew -o gradlew
          chmod +x gradlew

      - name: 🔨 Compilar APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: ✍️ Assinar e alinhar APK
        run: |
          zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/jarvis-aligned.apk

          apksigner sign \
            --ks /tmp/jarvis.keystore \
            --ks-pass pass:jarvispass \
            --key-pass pass:jarvispass \
            --ks-key-alias jarvis \
            --out /tmp/Jarvis.apk \
            /tmp/jarvis-aligned.apk

          echo "✅ APK assinado"
          ls -lh /tmp/Jarvis.apk

      - name: 📤 Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: /tmp/Jarvis.apk
          retention-days: 90

      - name: 📋 Sumário
        run: |
          echo "════════════════════════════════════════"
          echo "✅  BUILD CONCLUÍDO"
          echo "📱 APK: Jarvis.apk"
          echo "🌐 Abre: https://aurelhopedro.github.io/jarvis-voice/"
          echo "🔄 Para atualizar interface: push no index.html"
          echo "🔄 Para atualizar servidor: push no jarvis.yml"
          echo "📱 Para novo APK: só se mudar o MainActivity.java"
          echo "════════════════════════════════════════"
