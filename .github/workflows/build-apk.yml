name: "Build APK Jarvis Voice"

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar ferramentas do sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wget unzip imagemagick

      - name: Instalar Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH="$PATH:$HOME/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Criar keystore
        run: |
          keytool -genkeypair -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore /tmp/jarvis.keystore -storepass jarvispass -keypass jarvispass \
            -dname "CN=Jarvis,OU=Voice,O=Aurelhopedro,L=PT,S=PT,C=PT" -noprompt

      - name: Criar estrutura do projeto
        run: |
          mkdir -p src/com/aurelhopedro/jarvis
          mkdir -p res/values
          mkdir -p res/mipmap-mdpi
          mkdir -p res/mipmap-hdpi
          mkdir -p res/mipmap-xhdpi
          mkdir -p res/mipmap-xxhdpi
          mkdir -p res/mipmap-xxxhdpi
          mkdir -p bin

          # AndroidManifest.xml
          cat > AndroidManifest.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.aurelhopedro.jarvis"
    android:versionCode="1"
    android:versionName="1.0">
    <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="Jarvis"
        android:usesCleartextTraffic="true"
        android:hardwareAccelerated="true">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|keyboardHidden"
            android:screenOrientation="portrait">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
XMLEOF

          # res/values/strings.xml
          cat > res/values/strings.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">Jarvis</string>
</resources>
XMLEOF

          # MainActivity.java — sem androidx, usa só framework nativo
          cat > src/com/aurelhopedro/jarvis/MainActivity.java << 'JAVAEOF'
package com.aurelhopedro.jarvis;

import android.app.Activity;
import android.content.pm.PackageManager;
import android.os.Bundle;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.view.View;
import android.view.Window;
import android.view.WindowManager;
import android.widget.FrameLayout;
import android.graphics.Color;

public class MainActivity extends Activity {
    private WebView webView;
    private static final int MIC_PERMISSION = 1001;
    private static final String JARVIS_URL = "https://aurelhopedro.github.io/jarvis-voice/";

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        getWindow().setFlags(
            WindowManager.LayoutParams.FLAG_FULLSCREEN,
            WindowManager.LayoutParams.FLAG_FULLSCREEN
        );
        getWindow().getDecorView().setSystemUiVisibility(
            View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
            View.SYSTEM_UI_FLAG_FULLSCREEN |
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
        );

        FrameLayout layout = new FrameLayout(this);
        layout.setBackgroundColor(Color.parseColor("#0a0f1e"));
        setContentView(layout);

        webView = new WebView(this);
        layout.addView(webView, new FrameLayout.LayoutParams(
            FrameLayout.LayoutParams.MATCH_PARENT,
            FrameLayout.LayoutParams.MATCH_PARENT
        ));

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setMediaPlaybackRequiresUserGesture(false);
        settings.setAllowFileAccess(true);
        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
        settings.setUserAgentString("JarvisApp/1.0 Android");

        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public void onPermissionRequest(PermissionRequest request) {
                request.grant(request.getResources());
            }
        });
        webView.setWebViewClient(new WebViewClient() {
            @Override
            public boolean shouldOverrideUrlLoading(WebView view, String url) {
                return false;
            }
        });

        if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO)
                != PackageManager.PERMISSION_GRANTED) {
            requestPermissions(
                new String[]{android.Manifest.permission.RECORD_AUDIO},
                MIC_PERMISSION
            );
        } else {
            webView.loadUrl(JARVIS_URL);
        }
    }

    @Override
    public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
        webView.loadUrl(JARVIS_URL);
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }

    @Override protected void onPause() { super.onPause(); webView.onPause(); }
    @Override protected void onResume() { super.onResume(); webView.onResume(); }
    @Override protected void onDestroy() { webView.destroy(); super.onDestroy(); }
}
JAVAEOF

      - name: Criar ícones
        run: |
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dir="${entry%%:*}"; size="${entry##*:}"
            convert -size ${size}x${size} xc:"#0a0f1e" \
              -fill "#3b82f6" -pointsize $((size*2/3)) -gravity center \
              -annotate 0 "J" \
              res/mipmap-${dir}/ic_launcher.png 2>/dev/null \
              || convert -size ${size}x${size} xc:"#1a3a6b" \
                 res/mipmap-${dir}/ic_launcher.png 2>/dev/null \
              || { mkdir -p res/mipmap-${dir} && python3 -c "
import struct, zlib
def png(w,h,color):
    def chunk(t,d):
        c=zlib.crc32(t+d)&0xffffffff
        return struct.pack('>I',len(d))+t+d+struct.pack('>I',c)
    raw=b''.join(b'\x00'+bytes(color)*w for _ in range(h))
    return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
open('res/mipmap-${dir}/ic_launcher.png','wb').write(png(${size},${size},[26,58,107]))
"; }
          done

      - name: Compilar Java
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          echo "Android jar: $ANDROID_JAR"
          ls -la "$ANDROID_JAR"
          
          javac -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR" \
            -d bin/classes \
            src/com/aurelhopedro/jarvis/MainActivity.java
          echo "Compilação Java OK"

      - name: Converter para DEX
        run: |
          mkdir -p bin/dex
          d8 --output bin/dex \
             --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
             bin/classes/com/aurelhopedro/jarvis/*.class
          echo "DEX gerado:"
          ls -lh bin/dex/

      - name: Compilar recursos com aapt
        run: |
          aapt package -f -m \
            -J bin/gen \
            -M AndroidManifest.xml \
            -S res \
            -I "$ANDROID_HOME/platforms/android-34/android.jar" \
            -F bin/resources.ap_
          echo "Recursos compilados OK"

      - name: Montar APK
        run: |
          mkdir -p bin/apk
          cp bin/dex/classes.dex bin/apk/
          
          # Criar APK base com recursos
          cp bin/resources.ap_ /tmp/jarvis-unaligned.apk
          
          # Adicionar classes.dex ao APK
          cd bin/apk && zip -q /tmp/jarvis-unaligned.apk classes.dex
          cd -
          echo "APK montado"

      - name: Alinhar e assinar APK
        run: |
          zipalign -v 4 /tmp/jarvis-unaligned.apk /tmp/jarvis-aligned.apk
          apksigner sign \
            --ks /tmp/jarvis.keystore \
            --ks-pass pass:jarvispass \
            --key-pass pass:jarvispass \
            --ks-key-alias jarvis \
            --out /tmp/Jarvis.apk \
            /tmp/jarvis-aligned.apk
          echo "APK final:"
          ls -lh /tmp/Jarvis.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: /tmp/Jarvis.apk
          retention-days: 90
